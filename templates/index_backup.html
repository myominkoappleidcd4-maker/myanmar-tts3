<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myanmar Text to Voice</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f2f2f2;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 650px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 25px;
}

h1 {
    text-align: center;
    font-size: 42px;
}

textarea {
    width: 100%;
    height: 300px;
    font-size: 20px;
    padding: 15px;
    border-radius: 12px;
    box-sizing: border-box;
}

select {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    font-size: 18px;
    border-radius: 12px;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 16px;
    font-size: 20px;
    border: none;
    border-radius: 12px;
    background: #222;
    color: white;
}

audio {
    width: 100%;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>🇲🇲 Myanmar Text to Voice</h1>

<form method="POST">

<textarea name="text" placeholder="မြန်မာစာကို ဒီမှာထည့်ပါ..."></textarea>

<select name="voice">
    <option value="my-MM-NilarNeural">
        🇲🇲 Myanmar Female - Nilar
    </option>

    <option value="my-MM-ThihaNeural">
        🇲🇲 Myanmar Male - Thiha
    </option>
</select>

<button type="submit">🔊 အသံပြောင်းမယ်</button>

</form>

<p style="text-align:center;">
edge-tts Myanmar Neural Voice
</p>

</div>

</body>
</html>
