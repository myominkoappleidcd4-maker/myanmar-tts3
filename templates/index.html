<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myanmar Text to Voice</title>

<style>
body {
    margin: 0;
    background: #f5f5f5;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 600px;
    margin: 30px auto;
    background: white;
    padding: 30px;
    border-radius: 25px;
}

h1 {
    text-align: center;
    font-size: 38px;
}

textarea {
    width: 100%;
    height: 300px;
    box-sizing: border-box;
    padding: 16px;
    font-size: 20px;
    border: 2px solid #aaa;
    border-radius: 15px;
    resize: vertical;
}

label {
    display: block;
    margin-top: 20px;
    font-size: 18px;
}

select,
input {
    width: 100%;
    box-sizing: border-box;
    padding: 15px;
    margin-top: 8px;
    font-size: 18px;
    border: 2px solid #aaa;
    border-radius: 12px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 16px;
    font-size: 20px;
    border: none;
    border-radius: 12px;
    background: #222;
    color: white;
}

button:active {
    transform: scale(0.98);
}

.footer {
    text-align: center;
    margin-top: 25px;
    font-size: 16px;
}
</style>
</head>

<body>

<div class="container">

<h1>🇲🇲 Myanmar<br>Text to Voice</h1>

<form method="POST">

<textarea
name="text"
placeholder="မြန်မာစာကို ဤမှာထည့်ပါ..."
required></textarea>

<label>Voice</label>

<select name="voice">

<option value="my-MM-NilarNeural">
🇲🇲 Myanmar Female - Nilar
</option>

<option value="my-MM-ThihaNeural">
🇲🇲 Myanmar Male - Thiha
</option>

</select>

<label>File Name</label>

<input
type="text"
name="filename"
value="myanmar-voice"
placeholder="ဖိုင်နာမည်ထည့်ပါ">

<button type="submit">
🔊 အသံကြောင်းမယ်
</button>

</form>

<div class="footer">
edge-tts Myanmar Neural Voice
</div>

</div>

</body>
</html>
